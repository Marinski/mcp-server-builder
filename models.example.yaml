# Per-stage model routing for mcp-server-builder.
#
# Copy to models.yaml (gitignored) and edit. Every value that could identify your
# infrastructure is read from an environment variable, so this file stays safe to commit.
#
#   cp models.example.yaml models.yaml
#
# Two runners, because they reach different things:
#
#   claude    - Anthropic message shape (/v1/messages). Skills and agent personas are
#               native. Has a built-in fallback chain (--fallback-model a,b,c) but only
#               within one provider. Authenticates by OAuth, so it may have no API key.
#   opencode  - OpenAI-compatible (/v1/chat/completions) and every provider the Vercel AI
#               SDK supports. This is what lets you point a stage at a local model, a
#               LiteLLM gateway, or any OpenAI-compatible vendor.
#   pi        - earendil-works/pi. Takes provider and model as separate flags, and
#               `--mode json` is properly non-interactive. The credential is NOT a
#               flag: give pi the provider's api_key_env below (see the pi examples),
#               and never put a key on the command line — argv is exposed via ps and
#               shell history. A runner that demands a key flag is unsupported here.
#               Install: npm i -g @earendil-works/pi-coding-agent  (bin: `pi`)
#
# A gateway that speaks both shapes (LiteLLM does) can serve either runner.

runners:
  claude:
    cmd: claude
    # Non-interactive invocation. {model}/{provider}/{fallback}/{prompt_file}/
    # {stage}/{permission_mode}/{settings_file} substitute; the per-stage
    # allowed/disallowed tool lists come from runner/stage_contract.py and are
    # emitted through the *_tool_flag flags below.
    #
    # acceptEdits: a -p session has no TTY to answer a permission prompt, so an
    # unanswered Write/Edit is silently declined by default — a stage that writes
    # its own artifact (every stage does) fails closed with no file on disk and
    # no salvageable output. This is narrower than
    # --dangerously-skip-permissions: it only auto-accepts file edits, never
    # arbitrary Bash execution. The value itself comes from the stage contract,
    # so it can differ per stage.
    #
    # --settings {settings_file}: the lowest-scope settings come from a file
    # shipped under THIS checkout (runner/settings/claude-settings.json), not
    # from the target repo's .claude/settings.json. Claude Code merges
    # permission rules across scopes, so the shipped file pairs its WebFetch
    # allowlist with hard deny rules — Bash(*) and mcp__* — and a deny from
    # any scope beats an allow from a lower one: a third-party clone can add
    # allow rules, but cannot override the deny to widen the permission set.
    # Override the file with `settings_file` on this runner (models.yaml is
    # yours). The shipped default denies Bash(*) — and a deny cannot be
    # overridden by any --allowedTools — so if your stage personas run
    # build/test commands (e.g. the 5b/6 implement personas), add a separate
    # runner variant whose `settings_file` allows the specific commands you
    # accept; do not lift the deny unless you mean to. If your claude build
    # does not make --settings outrank the project file, set
    # `isolate_config: true` to run each stage against a fresh empty
    # CLAUDE_CONFIG_DIR instead.
    #
    # --strict-mcp-config: only MCP servers named in --mcp-config are loaded;
    # the explicit empty '{}' makes the session's MCP surface deterministically
    # empty, so a target repo's .mcp.json (and any user-scope MCP config) is
    # ignored. The deny mcp__* rule in the settings file backs this up even
    # if a claude build ignores the flag.
    args:
      - "-p"
      - "--model"
      - "{model}"
      - "--fallback-model"
      - "{fallback}"
      - "--permission-mode"
      - "{permission_mode}"
      - "--settings"
      - "{settings_file}"
      - "--strict-mcp-config"
      - "--mcp-config"
      - "{}"
    # Per-stage tool surface, emitted as repeated flag/value pairs, e.g.
    #   --allowedTools "WebFetch(domain:github.com)"
    #   --disallowedTools "WebFetch(*)"
    # opencode/pi have no such flags; leave these unset there.
    allowed_tool_flag: "--allowedTools"
    disallowed_tool_flag: "--disallowedTools"
    # Runner-owned settings file under this checkout (see above). Relative
    # paths resolve against the checkout root; absolute paths are used as-is.
    settings_file: runner/settings/claude-settings.json
    # Fallback isolation (see --settings above). Off by default because it also
    # hides any OAuth login stored in ~/.claude.
    isolate_config: false
    base_url_var: ANTHROPIC_BASE_URL
    api_key_var: ANTHROPIC_API_KEY
    # Claude Code can authenticate by OAuth, so a missing API key is not an error.
    auth_optional: true
  opencode:
    cmd: opencode
    args: ["run", "-m", "{model}", "--format", "json"]
  pi:
    cmd: pi
    # pi separates provider from model, which the other two conflate or omit.
    args: ["--provider", "{provider}", "--model", "{model}", "--mode", "json", "--no-session"]
    base_url_var: OPENAI_BASE_URL
    api_key_var: OPENAI_API_KEY

providers:
  # Anthropic direct. The default, and the only one enabled out of the box.
  anthropic:
    runner: claude
    api_key_env: ANTHROPIC_API_KEY
    # base_url_env is optional; omit to use the vendor default.
    base_url_env: ANTHROPIC_BASE_URL

  # --- OpenAI-compatible examples. Uncomment and point at your own endpoint. ---
  #
  # Any OpenAI-compatible endpoint: LiteLLM, vLLM, Ollama, OpenRouter, a vendor API.
  # Model names are written as provider/model for opencode's -m flag.
  #
  # gateway:
  #   runner: opencode
  #   api_key_env: MCP_BUILDER_GATEWAY_KEY
  #   base_url_env: MCP_BUILDER_GATEWAY_URL
  #
  # local:
  #   runner: opencode
  #   api_key_env: MCP_BUILDER_LOCAL_KEY
  #   base_url_env: MCP_BUILDER_LOCAL_URL
  #
  # --- pi examples. `remote` is the provider name pi itself knows; the key here
  # --- is just what you call it in this file.
  #
  # pi-anthropic:
  #   runner: pi
  #   remote: anthropic
  #   api_key_env: ANTHROPIC_API_KEY
  #
  # pi-google:
  #   runner: pi
  #   remote: google
  #   api_key_env: GEMINI_API_KEY
  #
  # pi-gateway:
  #   runner: pi
  #   remote: openai
  #   api_key_env: MCP_BUILDER_GATEWAY_KEY
  #   base_url_env: MCP_BUILDER_GATEWAY_URL

# Applied to any stage that does not override them.
defaults:
  provider: anthropic
  model: claude-sonnet-5
  # Tried in order when the primary is unavailable, overloaded, or errors.
  # Entries may name a different provider — the runner handles cross-provider fallback,
  # since no single CLI can do that itself.
  fallback:
    - { provider: anthropic, model: claude-opus-5 }
    - { provider: anthropic, model: claude-haiku-4-5-20251001 }

# Per-stage overrides. Keys match the playbook's stage ids.
#
# Guidance on where model quality actually matters, from running this pipeline:
#   Stages 2 and 3 produce judgement (the capability inventory and the MCP surface ADR).
#   A weaker model degrades these quietly rather than failing loudly, and every later
#   stage inherits the damage. Spend your best model here.
#   Stages 1b and 8 are extraction and formatting. Cheap models do fine.
stages:
  "1a": {}                                  # onboarding doc — defaults are fine
  "1b": {}                                  # signature extraction — safe to economise
  "2":  { model: claude-opus-5 }            # capability inventory — the key artifact
  "3":  { model: claude-opus-5 }            # MCP surface ADR — worst place to be cheap
  "4":  {}                                  # implementation spec
  "5":  {}                                  # implementation, phase by phase
  "6":  {}                                  # tests
  "7":  { model: claude-opus-5 }            # security hardening — judgement again
  "8":  {}                                  # docs — extraction, cheap is fine
  "9":  {}                                  # retro

# Agent persona per stage, resolved from agents/. Overriding is rarely needed;
# the mapping matches the playbook's Quick reference table.
agents:
  "1a": engineering-codebase-onboarding-engineer
  "1b": engineering-codebase-onboarding-engineer
  "2":  engineering-technical-writer
  "3":  specialized-mcp-builder
  "4":  product-manager
  "5":  specialized-mcp-builder
  "6":  testing-test-automation-engineer
  "7":  engineering-code-reviewer
  "8":  engineering-technical-writer
